# https://taskfile.dev

version: "3"

# ---------------------------------------------------------------------------
# Global task vars.
# ---------------------------------------------------------------------------
vars:
  PACKAGES:
    - l5
    - behavior_trees

tasks:
  # ---------------------------------------------------------------------------
  # Helpers
  # ---------------------------------------------------------------------------
  default:
    desc: "List all tasks."
    cmds:
      - task --list

  # ---------------------------------------------------------------------------
  # Build
  # ---------------------------------------------------------------------------

  clean:
    desc: Delete all build artifacts.
    cmds:
      - rm -rf build/*

  build-release:
    desc: "Configure and build release Web (WASM) targets with Emscripten + CMake + Ninja."
    env:
      BUILD_TYPE: Release
      BUILD_DIR: build/release
    aliases:
      - release
    cmds:
      - bash tasks/build-web.sh

  build-debug:
    desc: "Configure and build debug Web (WASM) targets with Emscripten + CMake + Ninja."
    env:
      BUILD_TYPE: Debug
      BUILD_DIR: build/debug
    aliases:
      - build
    cmds:
      - bash tasks/build-web.sh

  build-linux:
    desc: "Configure and build native Linux targets with CMake + Make (also used for clangd LSP)."
    env:
      BUILD_TYPE: Debug
      BUILD_DIR: build/linux
    aliases:
      - linux
    cmds:
      - bash tasks/build-linux.sh

  serve-web-release:
    desc: "Serve the release web build at http://localhost:8000."
    cmds:
      - python -m http.server --directory build/release/apps/l5

  serve-web-debug:
    desc: "Serve the debug web build at http://localhost:8000."
    aliases:
      - serve-web
    cmds:
      - python -m http.server --directory build/debug/apps/l5

  # ---------------------------------------------------------------------------
  # Test
  # ---------------------------------------------------------------------------

  test:
    desc: Run all unit tests.
    deps:
      - test-cpp
      - test-python

  test-cpp:
    desc: "[STUB] Run C++ unit tests via CTest. Requires CTest targets in CMakeLists."
    cmds:
      - echo "[STUB] test-cpp -- add enable_testing()/add_test() to CMakeLists, then replace with ctest --test-dir build/native --output-on-failure"

  test-python:
    desc: "Run Python tests with pytest."
    cmds:
      # Exit 5 means "no tests collected" which is fine until tests are written.
      - bash -c 'pytest tools/ || [ $? -eq 5 ]'

  # ---------------------------------------------------------------------------
  # Lint
  # ---------------------------------------------------------------------------

  lint:
    desc: Run all linters.
    deps:
      - lint-cpp
      - lint-python
      - lint-nix

  lint-cpp:
    desc: "[STUB] Run clang-tidy on C++ sources. Requires a .clang-tidy config."
    cmds:
      - echo "[STUB] lint-cpp -- create a .clang-tidy config, then replace with run-clang-tidy -p build/native"

  lint-python:
    desc: "Lint Python sources with ruff."
    cmds:
      - ruff check tools/

  lint-nix:
    desc: "[STUB] Lint nix files."
    cmds:
      - echo "[STUB] Lint nix files."

  # ---------------------------------------------------------------------------
  # Format
  # ---------------------------------------------------------------------------

  format-check:
    desc: "Run all format checks."
    deps:
      - format-check-cpp
      - format-check-python
      - format-check-nix

  format-check-cpp:
    desc: "[STUB] Check C++ formatting with clang-format. Requires a .clang-format config."
    cmds:
      - echo "[STUB] format-check-cpp -- create a .clang-format config, then replace with clang-format --dry-run --Werror on all sources"

  format-check-python:
    desc: "Check Python formatting with black."
    cmds:
      - black --check ./

  format-check-nix:
    desc: "Check Nix files are formatted with nixfmt."
    cmds:
      - nixfmt --check flake.nix $(find nix -name "*.nix")

  format:
    desc: "Run all formatters."
    deps:
      - format-cpp
      - format-python
      - format-nix

  format-cpp:
    desc: "[STUB] Fromat CPP files."
    cmds:
      - echo "[STUB] Fromat CPP files."

  format-python:
    desc: "Format Python files with black."
    cmds:
      - black ./

  format-nix:
    desc: "Check Nix files are formatted with nixfmt."
    cmds:
      - nixfmt flake.nix $(find nix -name "*.nix")

  # ---------------------------------------------------------------------------
  # CI meta-task (runs everything)
  # ---------------------------------------------------------------------------

  ci:
    desc: "Run the full CI suite (build, test, lint, format checks)."
    deps:
      - build-linux
      - build-release
      - build-debug
      - test
      - lint
      - format-check

  # ---------------------------------------------------------------------------
  # Dev tooling
  # ---------------------------------------------------------------------------

  update-flake-inputs:
    desc: "Updates all flake inputs."
    cmds:
      - nix flake update

  super-lint:
    desc: Run GitHub super linter.
    cmds:
      - >-
        sudo docker run
        -e LOG_LEVEL=INFO
        -e RUN_LOCAL=true
        -e DEFAULT_BRANCH=main
        -v $(pwd):/tmp/lint
        --rm
        ghcr.io/super-linter/super-linter:latest

  super-format:
    desc: Run GitHub super linter with all fix enabled.
    cmds:
      - >-
        sudo docker run
        -e LOG_LEVEL=INFO
        -e RUN_LOCAL=true
        -e DEFAULT_BRANCH=main
        -e FIX_YAML_PRETTIER=true
        -e FIX_MARKDOWN=true
        -e FIX_MARKDOWN_PRETTIER=true
        -e FIX_BIOME_FORMAT=true
        -e FIX_CLANG_FORMAT=true
        -v $(pwd):/tmp/lint
        --rm
        ghcr.io/super-linter/super-linter:latest
